# .github/workflows/build.yml  (fork con parches propios)
#  - workflow_dispatch: compilar a mano desde la pestana Actions.
#  - BIN_PATH relativo al repositorio (no depende de su nombre).
#  - Solo x64 (agrega x86 o arm64 a la lista si los necesitas).
#  - Acciones en versiones que ya corren en Node.js 24.
#  - Aplica en orden los archivos patches/*.patch antes de compilar
#    (con finales de linea LF para que los parches apliquen en Windows).

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        configuration: [release]
        platform: [x64]
      fail-fast: false

    env:
      SOLUTION_FILE_PATH: src/Shell.sln
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BIN_PATH: ${{ github.workspace }}\src\bin

    runs-on: windows-latest

    steps:
    # Los parches usan finales de linea LF (como estan en el repositorio).
    # Se desactiva la conversion a CRLF ANTES de descargar el codigo.
    - name: Keep LF line endings
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v5

    - name: Apply patches
      shell: bash
      run: |
        shopt -s nullglob
        patches=(patches/*.patch)
        if [ ${#patches[@]} -eq 0 ]; then echo "Sin parches"; exit 0; fi
        for p in "${patches[@]}"; do
          echo "Aplicando $p"
          git apply --verbose "$p"
        done

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: shell-${{ matrix.platform }}
        path: |
          ${{ env.BIN_PATH }}\*
          !${{ env.BIN_PATH }}\*.lib
          !${{ env.BIN_PATH }}\*.exp
          !${{ env.BIN_PATH }}\*.wixpdb
          !${{ env.BIN_PATH }}\ca.dll
        if-no-files-found: error
        retention-days: 30
