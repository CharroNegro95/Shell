# .github/workflows/build.yml  (version para el fork)
# Cambios respecto al original de moudey/Shell:
#  - workflow_dispatch: permite lanzar la compilacion a mano desde la pestana Actions.
#  - BIN_PATH usa github.workspace en vez de una ruta fija que dependia de que
#    el repositorio se llamara exactamente "Shell".
#  - Solo x64 para que tarde menos (agrega x86 o arm64 a la lista si los necesitas).
#  - Conserva los archivos 30 dias.
#  - Acciones en versiones que ya corren en Node.js 24 (quita el aviso de Node 20).

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        configuration: [release]
        platform: [x64]
      fail-fast: false

    env:
      SOLUTION_FILE_PATH: src/Shell.sln
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BIN_PATH: ${{ github.workspace }}\src\bin

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: shell-${{ matrix.platform }}
        path: |
          ${{ env.BIN_PATH }}\*
          !${{ env.BIN_PATH }}\*.lib
          !${{ env.BIN_PATH }}\*.exp
          !${{ env.BIN_PATH }}\*.wixpdb
          !${{ env.BIN_PATH }}\ca.dll
        if-no-files-found: error
        retention-days: 30
